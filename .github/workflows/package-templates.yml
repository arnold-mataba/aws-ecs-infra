name: Package Nested Templates

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'

concurrency:
  group: package-templates-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::107737161507:role/github-actions-cfn-package-aws-ecs
          aws-region: us-east-1
          role-session-name: github-actions-package-${{ github.run_id }}

      - name: Package nested templates
        run: |
          mkdir -p packaged
          aws cloudformation package \
            --template-file templates/root.yaml \
            --s3-bucket arnold-bucket-dev \
            --s3-prefix aws-ecs/templates \
            --output-template-file packaged/root-packaged.yaml

      - name: Commit packaged template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaged/root-packaged.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: package nested templates for ${{ github.sha }}"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - main moved, rebasing and retrying"
            git fetch origin main
            git rebase origin/main
            sleep 3
          done
          echo "Failed to push packaged template after 5 attempts"
          exit 1
